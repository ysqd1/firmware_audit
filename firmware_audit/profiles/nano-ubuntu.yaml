# 固件审计 profile: 宇树 nano(基于 Ubuntu 的 Buildroot/Ubuntu 系统)。
#
# 名单按"逻辑固件路径"匹配(step2_filter._logical_path 会先剥掉 binwalk 的
# .extracted/<N>/ 与 <fstype>-root/ 前缀),因此这里写的是固件内路径,
# 例如 etc/passwd,而不是 squashfs-root/etc/passwd。
#
# 为什么外置: 不同宇树机型(如 Yocto/其他构建系统)的固件路径不同,
# 换固件只需新增一个 profile,不必改代码。不做自动探测,显式 --profile 指定。

# 白名单目录:命中任一即强制保留(优先级最高,任何降噪不得误伤)
WHITELIST_DIRS:
  - "home/unitree"          # 宇树定制目录,最高优先级
  - "usr/lib/modules"       # 内核模块 .ko(厂商驱动,硬编码 URL/密钥常驻),豁免 usr/lib 黑名单

# etc 下敏感配置(精确到文件或子目录),白名单优先于黑名单/系统标准配置
WHITELIST_ETC:
  - "etc/passwd"
  - "etc/shadow"
  - "etc/sudoers"
  - "etc/group"
  - "etc/gshadow"
  - "etc/systemd"
  - "etc/init.d"
  - "etc/init"
  - "etc/ssh"
  - "etc/bluetooth"
  - "etc/docker"
  - "etc/NetworkManager"
  - "etc/default"
  - "etc/network"
  - "etc/netplan"
  - "etc/hostapd"
  - "etc/dropbear"
  - "etc/uhttpd"
  - "etc/nginx"
  - "etc/apache2"
  - "etc/crontab"
  - "etc/cron.d"
  - "etc/cron.daily"
  - "etc/cron.hourly"
  - "etc/adb"
  - "etc/adbkey"

# 黑名单目录:逻辑路径命中任一即排除
# 这些是标准 Linux 系统文件,审计无价值
BLACKLIST_DIRS:
  - "usr/share"
  - "usr/lib"
  - "usr/local/lib"  # Python SDK 标准目录(实测 2101 文件全是 boto3/typing_extensions/vlc.py
                     # 等第三方库,含 391 个 botocore endpoint-rule-set gz,零审计价值;
                     # 若不过滤,解开/残留的 gz 会被 Step4 分诊误标 opaque_firmware)
  - "usr/include"
  - "usr/src"
  - "lib"
  - "lib32"
  - "lib64"
  - "share/doc"
  - "share/man"
  - "share/locale"
  - "share/i18n"
  - "share/zoneinfo"
  - "share/fonts"
  - "share/icons"
  - "share/mime"

# 构建中间产物:CMake/Make 构建缓存与元数据,实测 home/unitree 下就有 876 个
# (.cmake=413、.make=380、.md5=53、.map=30),对审计零价值。
# 关键:此名单在 filter_files 中"优先于白名单"检查——home/unitree 虽是白名单整目录,
# 但构建产物是明确垃圾,不应保留;而 .sh/.py/.yaml/.h 等定制文件不受影响,仍全保留。
# 注意: .a/.o 不在此列(静态库/目标文件可能有审计价值),只在明确构建缓存目录下才排。
# 注意: 不含 ".map"。它作为纯子串会误伤 .NET runtime 的 settings.map 等非构建文件
# (实测 etc/mono/{2.0,4.0,4.5}/settings.map 被错误排除),收益小、误伤风险大,故去掉。
BUILD_ARTIFACT_PATTERNS:
  - ".cmake"
  - ".make"
  - ".md5"
  - "CMakeCache.txt"
  - "cmake_install.cmake"
  - "/build/"
  - "/cmake-build-"
  - "/_build/"

# 黑名单模式:作为子串匹配逻辑路径,命中即排除。
# 除语言/文档/字体等标准噪音外,不含构建产物(构建产物见 BUILD_ARTIFACT_PATTERNS,
# 需优先于白名单过滤,故独立成组)。
BLACKLIST_PATTERNS:
  - "locale/"
  - "/locale"
  - ".mo"
  - ".pot"
  - ".gmo"
  - ".locale"
  - "brltty"
  - "/man/"
  - "/doc/"
  - "/fonts/"
  - "/icons/"
  - "/zoneinfo/"

# 系统信任库目录:这些目录下的证书是发行版自带的 CA 信任库,不是厂商硬编码凭证。
# Step3/Step4 据此标记 is_system_trust=True,避免 Step5 当作可疑凭证上报,但仍可查询。
SYSTEM_TRUST_DIRS:
  - "etc/ssl/certs"
  - "etc/ca-certificates"
  - "etc/mono/certstore"
  - "etc/pki"
  - "etc/ssl/private"
  - "usr/share/ca-certificates"
  - "usr/lib/ssl/certs"

# 系统标准配置目录:发行版标准配置(模板/样例/默认值),对审计无价值。
# Step2 直接排除(白名单优先,以下目录均不在 WHITELIST_ETC,不会误伤)。
# 注意区分 SYSTEM_TRUST_DIRS(只针对证书信任库,标记而非删除)。
SYSTEM_STD_DIRS:
  - "etc/mono"
  - "etc/xdg"
  - "etc/X11"
  - "etc/sane.d"
  - "etc/apparmor.d"
  - "etc/dbus-1"
  - "etc/console-setup"
  - "etc/speech-dispatcher"
  - "etc/libibverbs.d"
  - "etc/ImageMagick-6"
  - "etc/menu-methods"
  - "etc/PackageKit"
  - "etc/security"
  - "etc/sysctl.d"
  - "etc/udev"
  - "etc/apport"
  - "etc/cracklib"
  - "etc/ld.so.conf.d"

# 低危信号降级目录:Step4 文本扫描在此目录下降低"低危信号"(password_kw/url/ipv4)
# 匹配,避免系统标配脚本的正常配置被误报。区别于 SYSTEM_STD_DIRS(排除送审):
# 此目录下的文件是"活着走到 Step4"的(多为 WHITELIST_ETC 保留的启动脚本/系统配置),
# 只降级不排除。原为 step4 硬编码 _SYSTEM_STD_DIRS,2026-08-30(C3)外置收敛。
SYSTEM_DOWNGRADE_DIRS:
  - "etc/apt"
  - "etc/default"
  - "etc/cron.d"
  - "etc/cron.daily"
  - "etc/init.d"
  - "etc/logrotate.d"
  - "etc/pam.d"
  - "etc/sudoers.d"
  - "etc/ssl"
  - "etc/ca-certificates"
  - "etc/pki"
  - "etc/ssh"
  - "etc/mono"
  - "usr/share/doc"
  - "usr/share/man"
  - "usr/share/zoneinfo"

# 搜索过滤目录:Step5 工具层(搜索/枚举)命中即跳过,避免 SDK 噪音刷屏。
# 注意区分: 这是"过滤"(文件仍审,只是搜索时不主动展示),不是"排除"(不送审)。
# 收纳原 Step5 工具层硬编码的 DEFAULT_EXCLUDE_DIRS / SDK_DIR_PREFIXES(2026-08-30)。
# .git/__pycache__/node_modules 等是工具噪音;usr/lib 等 SDK 目录与 BLACKLIST_DIRS
# 重叠但语义不同(黑名单=排除,此处=过滤)。
SEARCH_EXCLUDE_DIRS:
  - "usr/lib"
  - "usr/local/lib"
  - "usr/share"
  - "lib"
  - "opt"
  - ".git"
  - "__pycache__"
  - "node_modules"
  - ".pytest_cache"