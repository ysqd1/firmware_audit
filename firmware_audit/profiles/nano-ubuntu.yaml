# 固件审计 profile: 宇树 nano(基于 Ubuntu 的 Buildroot/Ubuntu 系统)。
#
# ADR-0011(Step2/3/4 退役)后,本文件只剩 SEARCH_EXCLUDE_DIRS 段——
# Step5 工具层(list_files/search_code/semgrep_scan)与简报现场概览消费,
# 命中即"搜索时跳过"(过滤噪音,不排除)。
#
# 为什么外置: 不同宇树机型(如 Yocto/其他构建系统)的固件路径不同,
# 换固件只需新增一个 profile,不必改代码。显式 --profile 指定
# (main.run_pipeline 会调 file_rules.configure 切换名单)。

SEARCH_EXCLUDE_DIRS:
  - "usr/lib"
  - "usr/local/lib"
  - "usr/share"
  - "lib"
  - "opt"
  - ".git"
  - "__pycache__"
  - "node_modules"
  - ".pytest_cache"
